* { box-sizing: border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 var(--ui); font-feature-settings:"cv11","ss03"; font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; overflow:hidden; }
button, input, select { font:inherit; color:inherit; }
button { background:var(--bg3); border:1px solid var(--border); border-radius:6px; padding:3px 10px; cursor:pointer; white-space:nowrap; }
button:hover:not(:disabled) { background:var(--bg-hover); }
button:disabled { opacity:.4; cursor:default; }
button.primary { background:var(--accent); color:var(--accent-fg); border-color:transparent; }
button.primary:hover:not(:disabled) { filter:brightness(1.12); background:var(--accent); }
button.flat { background:transparent; border-color:transparent; }
button.flat:hover:not(:disabled) { background:var(--bg-hover); }
button.on { background:var(--accent); color:var(--accent-fg); border-color:transparent; }
input[type=text], input[type=date], input[type=datetime-local], select { color:var(--fg); font:inherit; font-size:13px; background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:3px 7px; outline:none; }
input[type=text]:focus, input[type=date]:focus, input[type=datetime-local]:focus, select:focus { border-color:var(--accent); }
.mono { font-family:var(--mono); font-size:var(--code-fs,12.5px); font-variant-ligatures:none; font-feature-settings:"calt" 0,"liga" 0; font-variant-numeric:normal; }
kbd { font:11px var(--mono); font-variant-ligatures:none; background:var(--bg3); border:1px solid var(--border); border-radius:3px; padding:0 4px; }

#app { display:flex; flex-direction:column; height:100%; }
#topbar { display:flex; align-items:stretch; background:var(--bg2); border-bottom:1px solid var(--border); min-height:36px; }
.brand { display:flex; align-items:center; padding:0 14px; font-weight:600; letter-spacing:-.2px; font-size:16px; }
.brand b { color:var(--link); }
#tabs { display:flex; flex:1; overflow-x:auto; overflow-y:hidden; min-width:0; scrollbar-width:thin; }
.tab { display:flex; align-items:center; gap:6px; padding:0 8px 0 12px; border-right:1px solid var(--border); cursor:pointer; color:var(--fg-dim); white-space:nowrap; max-width:260px; }
.tab:hover { background:var(--bg3); }
.tab.active { background:var(--bg); color:var(--fg); box-shadow:inset 0 2px 0 var(--accent); }
.tab .tt { overflow:hidden; text-overflow:ellipsis; }
.tab .dot { color:var(--warn); }
.tab .x { border:none; background:transparent; padding:0 5px; border-radius:3px; color:var(--fg-dim); }
.tab .x:hover { background:var(--bg-hover); color:var(--fg); }
.tab .ico { opacity:.7; }
.topright { display:flex; align-items:center; gap:6px; padding:0 8px; }
#main { flex:1; min-height:0; position:relative; }
.panel { position:absolute; inset:0; display:none; flex-direction:column; }
.panel.show { display:flex; }
.toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:4px 6px; padding:5px 8px; background:var(--bg2); border-bottom:1px solid var(--border); }
.toolbar .sep { width:1px; align-self:stretch; background:var(--border); margin:2px 4px; }
.toolbar .sp { flex:1; }
.toolbar .chg { min-width:110px; text-align:center; }
@media (max-width: 1000px) { .toolbar .chg { min-width:64px; font-size:12px; } .toolbar .info { display:none; } .toolbar .sep { margin:0 2px; } }
.toolbar .info { color:var(--fg-dim); font-size:12px; }
.toolbar .info .dirty { color:var(--warn); font-weight:600; }
.banner { display:flex; align-items:center; gap:10px; padding:6px 12px; background:var(--bg3); border-bottom:1px solid var(--border); }
.banner[hidden] { display:none; }
.banner.warn { box-shadow:inset 3px 0 0 var(--warn); }
.banner.info { box-shadow:inset 3px 0 0 var(--link); }

/* ───────────── virtual scroller ───────────── */
.editor { flex:1; min-height:0; position:relative; display:flex; flex-direction:column; }
.vs { position:relative; flex:1; min-height:0; overflow:hidden; background:var(--bg); outline:none; }
.vs-rows { position:absolute; left:0; top:0; bottom:0; right:16px; overflow:hidden; }
.vs-row { position:absolute; left:0; right:0; white-space:pre; overflow:hidden; }
.vs-bar { position:absolute; right:0; top:0; bottom:0; width:16px; background:var(--bg2); border-left:1px solid var(--border); cursor:pointer; }
.vs-ruler { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.vs-thumb { position:absolute; left:0; right:0; background:rgba(128,128,128,.38); border-radius:2px; cursor:grab; }
.vs-thumb:hover, .vs-thumb.drag { background:rgba(128,128,128,.6); }
.hbar { display:flex; align-items:center; gap:8px; padding:2px 10px; background:var(--bg2); border-top:1px solid var(--border); font-size:11px; color:var(--fg-dim); }
.hbar input[type=range] { flex:1; max-width:380px; }

/* ───────────── document rows ───────────── */
.vs-fade { animation:vsfade .18s ease-out; }
@keyframes vsfade { from { opacity:.35 } to { opacity:1 } }
@media (prefers-reduced-motion:reduce) { .vs-fade { animation:none } }
.line { display:flex; height:20px; line-height:20px; }

/* ───────────── overlays ───────────── */

.toast.ok { border-left-color:var(--ok); } .toast.err { border-left-color:var(--danger); } .toast.out { opacity:0; }

.welcome { margin:auto; text-align:center; max-width:640px; padding:24px; }

/* ───────────── professional polish ───────────── */
:root { --r:6px; --h:28px; --ring:color-mix(in srgb, var(--accent) 55%, transparent); }
html { font-size:13px; }
button, input, select { font-family:inherit; }

button:hover:not(:disabled) { background:var(--bg-hover); }
button:active:not(:disabled) { transform:translateY(.5px); }

button.primary { background:var(--accent); color:var(--accent-fg); border-color:transparent; box-shadow:0 1px 2px rgba(0,0,0,.25); }

button.icon { width:var(--h); padding:0; background:transparent; border-color:transparent; color:var(--fg-dim); }

.ic { flex:none; display:block; }
:focus-visible { outline:2px solid var(--ring); outline-offset:1px; }
input:focus-visible, select:focus-visible { outline:none; box-shadow:0 0 0 3px var(--ring); }
[hidden] { display:none !important; }
/* the big text areas show their own caret and cursor line; a ring around the whole pane is noise */
.vs:focus-visible, .ce-s:focus-visible, .ce-ta:focus-visible, .rv-scroll:focus-visible, .jt-body:focus-visible, .tv .vsroot:focus-visible { outline:none; }
input[type=text], select { height:var(--h); padding:0 9px; border-radius:var(--r); background:var(--bg); border:1px solid var(--border); }
input[type=text]:focus, select:focus { border-color:var(--accent); }
select { padding-right:4px; }
kbd { border-radius:4px; border-bottom-width:2px; padding:0 5px; color:var(--fg-dim); font-size:10.5px; }
button.primary kbd { background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.3); color:inherit; }
::selection { background:color-mix(in srgb, var(--accent) 35%, transparent); }
* { scrollbar-width:thin; scrollbar-color:var(--bg-hover) transparent; }
::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:var(--bg-hover); border-radius:5px; border:2px solid transparent; background-clip:content-box; } ::-webkit-scrollbar-track { background:transparent; }

/* top bar + tabs */

.tab:hover { background:var(--bg3); }
.tab.active { background:var(--bg); color:var(--fg); border-color:var(--border); box-shadow:inset 0 2px 0 var(--accent); margin-bottom:-1px; height:35px; }

/* toolbar */

/* editor chrome */

/* find widget */
.find { border-radius:10px; padding:7px 8px; box-shadow:var(--shadow), 0 0 0 1px var(--border); border:none; }
.find .cnt { font-variant-numeric:tabular-nums; }

/* status bar: quiet, neutral */
#statusbar { background:var(--bg2); color:var(--fg-dim); border-top:1px solid var(--border); min-height:24px; padding:0 14px; font-size:11.5px; }
#statusbar #sb-left { color:var(--fg); }

/* dialogs */
.modal-back { background:rgba(8,10,14,.55); backdrop-filter:blur(3px); }
.modal { border-radius:12px; box-shadow:0 24px 60px rgba(0,0,0,.45), 0 0 0 1px var(--border); border:none; background:var(--bg2); }
.modal h3 { padding:16px 20px 6px; font-size:15px; font-weight:650; }

.modal .foot { padding:12px 20px; background:var(--bg); border-radius:0 0 12px 12px; }
.pick-list { border-radius:8px; } .pick-item { padding:5px 10px; } .pick-item .pi { display:flex; color:var(--fg-dim); }
.pick-item .pi:first-child .ic { color:var(--fg-dim); } .pick-item.dir .pi:first-child .ic { color:#e0a93b; fill:rgba(224,169,59,.22); } .pick-item.dir > span:nth-child(2) { font-weight:600; }
.toast { border-radius:8px; border:none; box-shadow:var(--shadow), 0 0 0 1px var(--border); padding:9px 14px; }

.s-row { display:flex; align-items:center; gap:12px; } .s-row input[type=range] { flex:1; accent-color:var(--accent); } .s-row output { min-width:52px; text-align:right; color:var(--fg-dim); font-variant-numeric:tabular-nums; }

.s-head h3 { padding:14px 20px 12px; }

/* ───────── table view ───────── */

/* ───────────── query tokenizer (mirrors the server) ───────────── */
function tokenize(q) {   // mirrors the server: spaces separate, "quotes" group, leading - excludes, \" is a quote, \- a literal dash
  const out = []; let cur = '', inq = false, lit = false;
  const flush = () => { if (!cur && !lit) return; const l = lit; lit = false; const t = cur; cur = '';
    if (!l && t.length > 1 && t[0] === '-') out.push({ t: t.slice(1), neg: true }); else if (t) out.push({ t, neg: false }); };
  const cs = [...q];
  for (let i = 0; i < cs.length; i++) {
    const ch = cs[i];
    if (ch === '\\' && cs[i + 1] === '"') { cur += '"'; lit = true; i++; }
    else if (ch === '\\' && cs[i + 1] === '-' && !cur && !inq) { cur += '-'; lit = true; i++; }
    else if (ch === '"') { inq = !inq; lit = true; }
    else if (/\s/.test(ch) && !inq) flush();
    else cur += ch;
  }
  flush(); return out;
}

    const nr = s.r2 - s.r1 + 1, nc = s.c2 - s.c1 + 1, allR = s.r1 === 0 && s.r2 === m.shown - 1, allC = s.c1 === 0 && s.c2 === m.ncols - 1;
    if (allR && allC) return 'all selected';
    if (allC) return `${fmtNum(nr)} row${nr === 1 ? '' : 's'} selected`;
    if (allR) return nc === 1 ? `column ${colLetters(s.c1)} “${m.names[s.c1]}” selected` : `${nc} columns selected`;
    return nr * nc === 1 ? '1 cell selected' : `${fmtNum(nr * nc)} cells selected (${fmtNum(nr)} × ${nc})`;
  }
  statusText() {
    const m = this.meta; if (!m) return '';

    const tags = []; if ((m.filters || []).length) tags.push('filtered'); if (m.dup) tags.push('duplicates only');
    if (tags.length) t += ` of ${fmtNum(m.nrows)} (${tags.join(', ')})`;
    t += ` · ${m.ncols} column${m.ncols === 1 ? '' : 's'}`;
    if (m.sorts && m.sorts.length) t += ` · sorted by ` + m.sorts.map(k => `${m.names[k.col]} ${k.desc ? '▼' : '▲'} (${SORT_SHORT[k.mode] || k.mode})`).join(', then ');
    const st = this.selText(); if (st) t += ` · ${st}`;
    if (this.aggTxt) t += ` · ${this.aggTxt}`;

  status() {

  scheduleAgg() {

  async aggregate(gen) {

        const r = await api('table/stats', { id: this.tab.info.id, col: s.c1 });
        txt = `${fmtNum(r.unique)} unique · ${fmtNum(r.blank)} blank` + (r.dup_rows ? ` · ${fmtNum(r.dup_rows)} duplicate rows` : '');
        if (r.numeric) txt += ` · Sum ${fmtD(r.numeric.sum)} · Avg ${fmtD(r.numeric.avg)} · Min ${fmtD(r.numeric.min)} · Max ${fmtD(r.numeric.max)}`;
      } else if (nr * nc > 1 && nr <= 500 && nr * nc <= 20000) {

        let n = 0, cnt = 0, sum = 0;

  async copy() {

  // ---- sort / duplicates

  // ---- detail bar: one slim bar under the icon strip, used by separator / filter / sort / duplicates

  dClose(d) { return `<span class="spc"></span><button class="d-close flat" title="Close this bar">${ic('x')}</button>`; }
  colOpts(sel) { return this.meta.names.slice(0, 300).map((n, i) => `<option value="${i}"${i === sel ? ' selected' : ''}>${colLetters(i)} · ${esc(n)}</option>`).join(''); }

  // separator
  dSep(d) {

  // sort levels
  dSort(d) {
    const m = this.meta;
    if (!this.skeys) this.skeys = (m.sorts && m.sorts.length) ? m.sorts.map(k => ({ ...k })) : [{ col: this.sel ? this.sel.c1 : 0, desc: false, mode: 'auto' }];
    const kindOpts = sel => SORT_MODES.map(([k, l]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${l}</option>`).join('');
    const box = el('div', 'lvls'); const keys = this.skeys;
    const read = () => { this.skeys = [...box.querySelectorAll('.lvl')].map(r => ({ col: +$('.l-col', r).value, mode: $('.l-kind', r).value, desc: $('.l-dir', r).value === '1' })); };

  // filters (conditions)

          `<button class="f-ci flat${f.ci ? '' : ' on'}" title="${f.ci ? 'Ignoring upper/lower case. Click to match case' : 'Matching case. Click to ignore case'}"${(none || ['gt', 'ge', 'lt', 'le', 'between'].includes(f.op)) ? ' hidden' : ''}>${ic('aa')}</button><button class="f-x flat" title="Remove this condition">${ic('x')}</button></div>`;
      }).join('') + `</div><div class="ferr" hidden></div><div class="frow"><button class="f-add" title="Add another condition (all conditions must match)">${ic('plus')}</button><button class="f-apply primary" title="Apply the filter (Enter)">${ic('filter')}<span class="lbl">Filter</span></button><button class="f-clear" title="Remove all filters">${ic('x')}</button><span class="hint" style="width:auto">All conditions must match. Numbers compare numerically; text ignores case unless Aa is on.</span>${this.dClose()}</div>`;
    };

      this.fdraft = [...d.querySelectorAll('.frow[data-i]')].map((r, i) => { const o = this.fdraft[i]; return { ...o, col: +$('.f-col', r).value, op: $('.f-op', r).value, v: $('.f-v', r) ? $('.f-v', r).value : o.v, v2: $('.f-v2', r) ? $('.f-v2', r).value : o.v2 }; });

      try { this.tab.panel.classList.add('busy'); this.apply(await api('table/filter', { id: this.tab.info.id, filters: fs }), false); this.fdraft = null; if (this.dk === 'filter') this.renderDetail(); }
      catch (e) { err.hidden = false; err.textContent = e.message; }

    };

  async setFilters(fs) {

  // Excel-style drop-down from the funnel in a column header: tick the values to keep

  }

  // duplicates over one or several columns
  dDup(d) {
    const m = this.meta;
    d.innerHTML = `<span class="dl">Duplicates when these match</span><label class="cc"><input type="checkbox" class="d-all"${this.dcols.size ? '' : ' checked'}> Entire row</label><div class="dcols">` +
      m.names.slice(0, 300).map((n, i) => `<label class="cc"><input type="checkbox" class="d-c" value="${i}"${this.dcols.has(i) ? ' checked' : ''}> ${colLetters(i)} · ${esc(n)}</label>`).join('') +
      `</div><label class="cc"><input type="checkbox" class="d-ci"${this.dci ? ' checked' : ''}> Ignore case</label><button class="d-go primary" title="Find duplicates: rows where ALL ticked columns match another row">${ic('dup')}<span class="lbl">Find</span></button>${m.dup ? `<button class="d-off" title="Show all rows again">${ic('x')}</button>` : ''}<span class="hint">Tick one column for a single-column check, or several to treat the combination as the key (for example name + city). Blank keys are never counted as duplicates.</span>${this.dClose()}`;

  async resetView() {
    const id = this.tab.info.id; let m = this.meta;
    if ((m.filters || []).length) m = await api('table/filter', { id, filters: [] });
    if (m.dup) m = await api('table/dups', { id, off: true });

    this.apply(m, false);
  }
  updateStrip() {

    this.q('.t-filter').classList.toggle('on', !!fs.length); this.q('.t-dup').classList.toggle('on', !!m.dup);
    this.q('.t-hdr').classList.toggle('on', this.hdr); this.q('.t-sepb').classList.toggle('on', this.delimSel !== 'auto');
    const parts = [];
    if (fs.length) parts.push(`Filter: ` + fs.map(f => `<span class="fchip">${colLetters(f.col)} “${esc(m.names[f.col])}” ${esc(filterText(f))}</span>`).join('') + ` <a class="lnk t-fall">clear</a>`);
    if (m.dup) {
      const extra = m.dup.rows - m.dup.groups, cols = m.dup.cols || [];
      const what = cols.length ? 'columns ' + cols.map(c => `${colLetters(c)} “${esc(m.names[c])}”`).join(' + ') : 'whole row';
      parts.push(`<b>${fmtNum(m.dup.rows)}</b> duplicate rows in <b>${fmtNum(m.dup.groups)}</b> group${m.dup.groups === 1 ? '' : 's'} (${fmtNum(extra)} extra) · matched on ${what}${m.dup.ci ? ', ignoring case' : ''} · <a class="lnk t-all">show all rows</a>`);

  }
}

/* ───────────── world clock (own tab; nothing runs until it is opened, and nothing ticks while it is hidden) ───────────── */
const WC = {
  ALIAS: { IST: 'Asia/Kolkata', PST: 'America/Los_Angeles', PDT: 'America/Los_Angeles', PT: 'America/Los_Angeles', MST: 'America/Denver', CST: 'America/Chicago', CT: 'America/Chicago', EST: 'America/New_York', EDT: 'America/New_York', ET: 'America/New_York', GMT: 'Europe/London', BST: 'Europe/London', CET: 'Europe/Paris', CEST: 'Europe/Paris', EET: 'Europe/Athens', MSK: 'Europe/Moscow', JST: 'Asia/Tokyo', KST: 'Asia/Seoul', SGT: 'Asia/Singapore', HKT: 'Asia/Hong_Kong', AEST: 'Australia/Sydney', AEDT: 'Australia/Sydney', NZST: 'Pacific/Auckland', GST: 'Asia/Dubai', PKT: 'Asia/Karachi', UTC: 'UTC' },
  LEGACY: { 'Asia/Calcutta': 'Asia/Kolkata', 'Asia/Saigon': 'Asia/Ho_Chi_Minh', 'Asia/Rangoon': 'Asia/Yangon', 'Asia/Katmandu': 'Asia/Kathmandu', 'Europe/Kiev': 'Europe/Kyiv', 'Asia/Dacca': 'Asia/Dhaka', 'Atlantic/Faeroe': 'Atlantic/Faroe' },
  // day/night colours by season: [night, day, working hours, night text, day text]
  SEASONS: {
    spring: { name: 'Spring', light: ['#35514a', '#e9f4e1', '#a5d49a', '#cfe3d9', '#31503a'], dark: ['#2f4a43', '#3a5042', '#5d9a63', '#cfe3d9', '#e4f2e0'] },
    summer: { name: 'Summer', light: ['#1f3a62', '#fdf1c4', '#ffc552', '#c9d8ee', '#5a4a12'], dark: ['#223d66', '#5a5230', '#c99a2e', '#c9d8ee', '#fbf0c8'] },
    autumn: { name: 'Autumn', light: ['#44283a', '#f6e4c8', '#e29a52', '#e9d2d9', '#5b3a1d'], dark: ['#41293a', '#5a4330', '#b9692d', '#e9d2d9', '#f6e4c8'] },
    winter: { name: 'Winter', light: ['#25345a', '#e8f0f9', '#97bfe3', '#cdd8ee', '#2f4468'], dark: ['#2a3a60', '#38475f', '#4f7fae', '#cdd8ee', '#e3edf8'] },
  },
  seasonOf(ms) { const m = new Date(ms).getMonth(); return m >= 2 && m <= 4 ? 'spring' : m >= 5 && m <= 7 ? 'summer' : m >= 8 && m <= 10 ? 'autumn' : 'winter'; },   // northern-hemisphere months
  local: () => { const z = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; return WC.LEGACY[z] || z; },
  all: null, fmt: {},
  zones() { if (!WC.all) { try { WC.all = Intl.supportedValuesOf('timeZone'); } catch (e) { WC.all = []; } if (!WC.all.includes('UTC')) WC.all.push('UTC'); } return WC.all; },
  ok(z) { try { new Intl.DateTimeFormat('en', { timeZone: z }); return true; } catch (e) { return false; } },
  city: z => z === 'UTC' ? 'UTC' : z.split('/').pop().replace(/_/g, ' '),
  f(z, kind, h12) {
    const k = z + kind + h12; if (WC.fmt[k]) return WC.fmt[k];
    const o = { timeZone: z };
    if (kind === 't') Object.assign(o, { hour: '2-digit', minute: '2-digit', hour12: h12 });
    else if (kind === 'd') Object.assign(o, { weekday: 'short', month: 'short', day: 'numeric' });
    else if (kind === 'a') Object.assign(o, { timeZoneName: 'short' });
    else Object.assign(o, { year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric', hourCycle: 'h23' });
    return (WC.fmt[k] = new Intl.DateTimeFormat(kind === 'p' ? 'en-US' : undefined, o));
  },
  parts(z, ms) { const r = {}; for (const p of WC.f(z, 'p', false).formatToParts(ms)) if (p.type !== 'literal') r[p.type] = +p.value; return r; },
  offset(z, ms) { const p = WC.parts(z, ms); return Math.round((Date.UTC(p.year, p.month - 1, p.day, p.hour % 24, p.minute, p.second) - Math.floor(ms / 1000) * 1000) / 60000); },
  // 'YYYY-MM-DDTHH:MM' typed as wall-clock time in zone z -> instant (ms)
  fromLocal(z, v) { const m = /^(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(v); if (!m) return null; const g = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]); let t = g - WC.offset(z, g) * 60000; t = g - WC.offset(z, t) * 60000; return t; },
  toInput(z, ms) { const p = WC.parts(z, ms), n = k => String(p[k]).padStart(2, '0'); return `${p.year}-${n('month')}-${n('day')}T${String(p.hour % 24).padStart(2, '0')}:${n('minute')}`; },
  // daylight saving: the UTC offsets of a zone through one year, with the exact moments it changes
  dst(z, year) {
    const k = z + '|' + year; if (WC._dst[k]) return WC._dst[k];
    const t0 = Date.UTC(year, 0, 1), t1 = Date.UTC(year + 1, 0, 1), step = 15 * 86400000, pts = [];
    for (let t = t0; t < t1; t += step) pts.push([t, WC.offset(z, t)]);
    pts.push([t1, WC.offset(z, t1)]);
    const changes = [];
    for (let i = 1; i < pts.length; i++) {
      if (pts[i][1] === pts[i - 1][1]) continue;
      let lo = pts[i - 1][0], hi = pts[i][0]; const a = pts[i - 1][1];
      while (hi - lo > 60000) { const mid = Math.floor((lo + hi) / 2 / 60000) * 60000; if (WC.offset(z, mid) === a) lo = mid; else hi = mid; }
      changes.push({ t: hi, from: a, to: WC.offset(z, hi) });
    }
    const offs = pts.map(p => p[1]), std = Math.min(...offs), res = { std, max: Math.max(...offs), changes, uses: std !== Math.max(...offs), start: pts[0][1], year };
    return (WC._dst[k] = res);
  },
  isDst(z, ms) { const d = WC.dst(z, new Date(ms).getUTCFullYear()); return d.uses && WC.offset(z, ms) > d.std; },
  nextChange(z, ms) { const y = new Date(ms).getUTCFullYear(); for (const yy of [y, y + 1]) for (const c of WC.dst(z, yy).changes) if (c.t > ms) return c; return null; },
  _dst: {},
  mins(z, ms) { const p = WC.parts(z, ms); return (p.hour % 24) * 60 + p.minute; },
  offName(m) { const a = Math.abs(m); return 'UTC' + (m < 0 ? '−' : '+') + Math.floor(a / 60) + (a % 60 ? ':' + String(a % 60).padStart(2, '0') : ''); },
  rel(d) { if (!d) return 'same time'; const a = Math.abs(d), t = Math.floor(a / 60) + 'h' + (a % 60 ? ' ' + (a % 60) + 'm' : ''); return t + (d < 0 ? ' behind' : ' ahead'); },
};

/* update check: strictly opt-in (Settings → General). The server makes the one request; the page only shows the answer. */
const Update = {
  async run(manual, out) {
    const say = t => { if (out) out.textContent = t; };
    try {
      say('Checking…'); const r = await api('update/check', { repo: prefs.get('updrepo', '') });
      prefs.set('updlast', Date.now());
      if (!r.newer) { say(`You have the latest version (${r.current}).`); return; }
      say(`Version ${r.latest} is available (you have ${r.current}).`);
      if (manual || prefs.get('updseen', '') !== r.latest) { prefs.set('updseen', r.latest); this.note(r); }
    } catch (e) { say(manual ? e.message : ''); }
  },
  note(r) {
    const box = el('div', 'toast remind'); box.innerHTML = `<span>${ic('info', 14)} <b></b></span>`; $('b', box).textContent = `Kempt ${r.latest} is available`;
    if (r.url) { const a = el('a'); a.href = r.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = 'See what is new'; a.className = 'btn-link'; box.appendChild(a); }
    const x = el('button'); x.textContent = 'Later'; x.onclick = () => box.remove(); box.appendChild(x); $('#toasts').appendChild(box);
  },
  auto() { if (prefs.get('updchk', false) && Date.now() - (+prefs.get('updlast', 0) || 0) > 86400000) this.run(false); },
};

      $('.tm span', r).textContent = `${WC.offName(off)} | ${z === loc ? 'local' : WC.rel(off - lo)} | ${WC.f(z, 'd', h).format(ms)}`;
      { const p = WC.parts(z, ms), ymd = `${p.year}-${String(p.month).padStart(2, '0')}-${String(p.day).padStart(2, '0')}`, hn = HOL.on(ymd, HOL.country(z)); let b = $('.hd2', r); if (hn.length) { if (!b) { b = el('span', 'hd2'); $('.tm', r).appendChild(b); } b.textContent = '★ ' + hn.join(', '); b.title = hn.join(', '); } else if (b) b.remove(); }

          let cls = hr >= 21 || hr < 6 ? 'n' : hr >= 9 && hr < 17 ? 'w' : 'd', why = '';
          if (cls === 'w') {   // working hours do not apply on Saturday, Sunday or a holiday in that zone
            const p = WC.parts(z, t), wd = new Date(Date.UTC(p.year, p.month - 1, p.day)).getUTCDay(), hn = HOL.on(`${p.year}-${String(p.month).padStart(2, '0')}-${String(p.day).padStart(2, '0')}`, HOL.country(z));
            if (hn.length) { cls = 'o'; why = ' · holiday: ' + hn.join(', '); } else if (wd === 0 || wd === 6) { cls = 'o'; why = ' · weekend'; }
          }
          c.className = cls; if (hr === 0) c.className += ' m';
          c.textContent = h ? (hr % 12 || 12) : hr; c.title = WC.f(z, 't', h).format(t) + ' · ' + WC.f(z, 'd', h).format(t) + why;

    }
    if (this.dt && document.activeElement !== this.dt) this.dt.value = this.ref == null ? '' : WC.toInput(this.zone(), ms);
    const f = (ms - d0) / 86400000, st0 = this.rows.querySelector('.strip');
    if (st0) {   // one marker over all strips

  }
  schedule() {   // live: one wake-up per minute, only while this tab is visible
    clearTimeout(this.timer); this.timer = 0;
    if (this.ref != null || !this.panel.classList.contains('show')) return;

  onShow() { this.update(); this.schedule(); if (!this.tm) { this.tm = new MutationObserver(() => this.paint()); this.tm.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } if (!this.ro && window.ResizeObserver) { this.ro = new ResizeObserver(() => this.panel.classList.contains('show') && this.update()); this.ro.observe(this.grid); } }
  onHide() { clearTimeout(this.timer); this.timer = 0; }
  dispose() { clearTimeout(this.timer); if (this.ro) this.ro.disconnect(); if (this.tm) this.tm.disconnect(); WC.fmt = {}; }
}


/* ───────────── checklist, notes and reminders ─────────────
   Stored in one small JSON file (notes.json) next to the settings: no database. Reminders use a single timer that is
   armed for the next due item only, so nothing runs when there are none. They fire while Kempt is open in a browser
   tab; anything that came due while it was closed is reported the next time it opens. */
const Notes = {
  items: [], pad: '', caps: {}, loaded: false, timer: 0, _t: 0, _dirty: {},
  async load() { try { const j = await api('notes/get'); this.caps = j.caps || {}; this.items = Array.isArray(j.items) ? j.items.filter(i => i && typeof i.t === 'string') : []; this.pad = typeof j.pad === 'string' ? j.pad : ''; } catch (e) { console.warn('notes not loaded:', e.message); } this.loaded = true; try { DSTA.sync(); RPT.sync(); } catch (e) { console.warn('clock alerts / repeats:', e.message); } this.badge(); this.arm(true); },
  save(k) { this._dirty[k || 'items'] = 1; clearTimeout(this._t); this._t = setTimeout(() => this.flush(), 500); },
  async flush() { clearTimeout(this._t); const d = this._dirty; this._dirty = {}; const patch = {}; if (d.items) patch.items = this.items; if (d.pad) patch.pad = this.pad; if (Object.keys(patch).length) { try { await api('notes/set', { patch }); } catch (e) { toast('Notes not saved: ' + e.message, 'err', 6000); } } },
  beacon() { if (!Object.keys(this._dirty).length) return; const patch = {}; if (this._dirty.items) patch.items = this.items; if (this._dirty.pad) patch.pad = this.pad; this._dirty = {}; try { fetch('/api/notes/set', { method: 'POST', keepalive: true, headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify({ patch }) }); } catch (_) { } },
  id: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
  due() { return this.items.filter(i => !i.done && i.due && i.fired && !i.k); },
  badge() { const n = this.due().length, b = $('#btn-notes .nb'); if (b) { b.hidden = !n; b.textContent = n; } },
  arm(first) {   // one timer, for the soonest unfired reminder
    clearTimeout(this.timer); this.timer = 0; const now = Date.now(); try { RPT.sync(false); } catch (_) { }
    const next = this.items.filter(i => !i.done && i.due && !i.fired).sort((a, b) => a.due - b.due)[0];
    if (first) { const late = this.items.filter(i => !i.done && i.due && !i.fired && i.due <= now); if (late.length) { for (const i of late) i.fired = true; this.save(); this.badge(); toast(`${late.length} reminder${late.length > 1 ? 's were' : ' was'} due while Kempt was closed: ${late.slice(0, 2).map(i => i.t).join(', ')}${late.length > 2 ? '…' : ''}`, 'info', 10000); this.refresh(); return this.arm(); } }
    if (!next) return;
    const d = next.due - now; if (d <= 0) return this.fire(next);
    this.timer = setTimeout(() => this.arm(), Math.min(d, 3600000));   // re-check at least hourly (long timers drift or overflow)
  },
  fire(i) {
    i.fired = true; this.save(); this.badge(); this.refresh();
    if (prefs.get('sound', true) && !this.caps.sound) Sound.ring();   // when the program itself can play sound it already does
    if (document.hidden) { const old = document.title; document.title = '⏰ ' + i.t; const back = () => { if (!document.hidden) { document.title = old; document.removeEventListener('visibilitychange', back); } }; document.addEventListener('visibilitychange', back); }
    const box = el('div', 'toast remind'); box.innerHTML = `<span>${ic('bell', 14)} <b></b></span><button class="sn">Snooze 10 min</button><button class="dn primary">Done</button>`;
    $('b', box).textContent = i.t; $('#toasts').appendChild(box);
    const gone = () => box.remove();
    $('.sn', box).onclick = () => { i.due = Date.now() + 600000; i.fired = false; delete i.n; this.save(); this.badge(); this.arm(); this.refresh(); gone(); };
    $('.dn', box).onclick = () => { if (i.rep && !i.k) { RPT.advance(i); this.save(); this.arm(); this.badge(); this.refresh(); gone(); return; } i.done = true; this.save(); this.badge(); this.refresh(); gone(); };
    setTimeout(() => box.classList.add('out'), 29700); setTimeout(gone, 30000);
    try { if (!this.caps.os && window.Notification && Notification.permission === 'granted') new Notification('Kempt reminder', { body: i.t }); } catch (_) { }
    this.arm();
  },
  refresh() { const t = Tabs.list.find(x => x.kind === 'notes'); if (t) t.render(); },
};

/* reminder sound: three short tones made with the Web Audio API (no sound file). Browsers only allow audio after you have
   clicked or typed in the page once, so the audio context is created on the first interaction. */
const Sound = {
  ctx: null,
  unlock() { try { if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); } catch (_) { } },
  ring() {
    this.unlock(); const c = this.ctx; if (!c) return false;
    const t0 = c.currentTime + 0.02;
    [0, 0.28, 0.56].forEach((d, k) => { const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = k === 2 ? 1175 : 880; g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.35, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.22); o.connect(g); g.connect(c.destination); o.start(t0 + d); o.stop(t0 + d + 0.25); });
    return true;
  },
};
['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, () => Sound.unlock(), { capture: true, once: true }));
const toLocalInput = ms => { const d = new Date(ms), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
class NotesTab {
  constructor() {
    this.kind = 'notes'; this.icon = ic('notes', 14); this.showDone = true;
    this.panel = el('div', 'panel');
    this.panel.innerHTML = `<div class="nt"><div class="wrap">
      <section><h2>Checklist<span class="sp"></span><button class="clr" title="Remove all ticked items">Clear done</button></h2>
        <div class="addrow"><input type="text" class="t" placeholder="Add an item, then press Enter" spellcheck="false" aria-label="New item"><input type="datetime-local" class="w" title="Optional reminder time" aria-label="Reminder time"><select class="cat" title="Work or personal" aria-label="Category">${[['w', 'Work'], ['p', 'Personal']].map(([v, n]) => `<option value="${v}">${n}</option>`).join('')}</select><select class="rp" title="Repeat" aria-label="Repeat">${RPT.OPTS.map(([v, n]) => `<option value="${v}">${n}</option>`).join('')}</select><button class="primary go">Add</button></div>
        <div class="seg" role="group" aria-label="Show"></div>
        <div class="list"></div>
        <p class="hint">Set a time to get a reminder. Reminders are announced with a desktop notification and sound while Kempt is running (start it at login in Settings → General to keep it running with no browser open); anything that came due while it was closed is shown when you next open it.</p></section>
      <section><h2>Notes</h2><textarea class="pad" placeholder="Scratchpad: free text, saved automatically." spellcheck="false" aria-label="Notes"></textarea><p class="hint">Saved on this computer in <code>notes.json</code> next to the settings.</p></section></div></div>`;
    const q = s => $(s, this.panel); this.list = q('.list'); this.pad = q('.pad'); this.t = q('.t'); this.w = q('.w'); this.rp = q('.rp'); this.cat = q('.cat'); this.cat.value = prefs.get('ncat', 'w') === 'p' ? 'p' : 'w'; this.cat.onchange = () => prefs.set('ncat', this.cat.value); this.seg = q('.seg'); this.filt = ['w', 'p'].includes(prefs.get('nfilt', '')) ? prefs.get('nfilt', '') : '';
    this.pad.value = Notes.pad; this.pad.oninput = () => { Notes.pad = this.pad.value; Notes.save('pad'); };
    const add = () => { const t = this.t.value.trim(); if (!t) return; const due = this.w.value ? new Date(this.w.value).getTime() : null; const it = { id: Notes.id(), t, c: this.cat.value, done: false, due: due && !isNaN(due) ? due : null, fired: false }; if (it.due && this.rp.value) { it.rep = this.rp.value; it.base = it.due; } Notes.items.push(it); this.t.value = ''; this.w.value = ''; this.rp.value = ''; if (due) this.ask(); Notes.save(); RPT.sync(false); Notes.arm(); Notes.badge(); this.render(); this.t.focus(); };
    q('.go').onclick = add; this.t.onkeydown = e => { if (e.key === 'Enter') add(); };
    q('.clr').onclick = () => { Notes.items = Notes.items.filter(i => i.k || !i.done || !this.shows(i)); Notes.save(); RPT.sync(false); Notes.arm(); Notes.badge(); this.render(); };
    this.render();
  }
  title() { return 'Checklist'; }
  shows(i) { return !this.filt || i.c === this.filt; }
  ask() { try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch (_) { } }
  fmt(ms) { const d = new Date(ms), n = new Date(), t = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), day = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000); return (day === 0 ? 'Today' : day === 1 ? 'Tomorrow' : day === -1 ? 'Yesterday' : d.toLocaleDateString([], { month: 'short', day: 'numeric' })) + ' ' + t; }
  render() {
    const keep = document.activeElement && this.list.contains(document.activeElement) ? document.activeElement.closest('.it')?.dataset.id : null;
    const all = Notes.items.filter(i => !i.k), cnt = { '': all.length, w: all.filter(i => i.c === 'w').length, p: all.filter(i => i.c === 'p').length };
    this.seg.innerHTML = ''; for (const [v, n] of [['', 'All'], ['w', 'Work'], ['p', 'Personal']]) { const b = el('button'); b.type = 'button'; b.dataset.f = v; b.setAttribute('aria-pressed', String(this.filt === v)); b.innerHTML = `${n}<small>${cnt[v]}</small>`; b.onclick = () => { this.filt = v; prefs.set('nfilt', v); if (v) { this.cat.value = v; prefs.set('ncat', v); } this.render(); }; this.seg.appendChild(b); }
    const mine = all.filter(i => this.shows(i)), items = [...mine.filter(i => !i.done), ...mine.filter(i => i.done)];   // clock-change alerts live in the World clock tab
    this.list.innerHTML = items.length ? '' : `<div class="empty">${this.filt ? 'No ' + (this.filt === 'w' ? 'work' : 'personal') + ' items yet.' : 'Nothing here yet. Add your first item above.'}</div>`;
    for (const i of items) {
      const late = !i.done && i.due && i.fired, r = el('div', 'it' + (i.done ? ' done' : '') + (late ? ' due' : '') + (i.due && !i.done ? ' hd' : '')); r.dataset.id = i.id;
      r.innerHTML = `<input type="checkbox" aria-label="Done"><input type="text" class="tx" spellcheck="false" aria-label="Item"><span class="meta"><select class="cs" title="Work or personal" aria-label="Category"><option value="">–</option><option value="w">Work</option><option value="p">Personal</option></select><span class="when"></span></span><button class="x" title="Delete" aria-label="Delete item">${ic('x', 12)}</button>`;
      const cb = $('input[type=checkbox]', r), tx = $('.tx', r), wh = $('.when', r), cs = $('.cs', r); cb.checked = i.done; tx.value = i.t; cs.value = i.c || ''; cs.className = 'cs ' + (i.c || ''); cs.onchange = () => { if (cs.value) i.c = cs.value; else delete i.c; Notes.save(); this.render(); };
      cb.onchange = () => { if (i.rep && cb.checked) { RPT.advance(i); toast('Next: ' + this.fmt(i.due), 'info', 4000); RPT.sync(false); Notes.save(); Notes.arm(); Notes.badge(); this.render(); return; } i.done = cb.checked; if (i.done && i.rep) { delete i.rep; delete i.base; } if (!i.done && i.due && i.due <= Date.now()) i.fired = true; Notes.save(); Notes.arm(); Notes.badge(); this.render(); };
      tx.onchange = () => { const v = tx.value.trim(); if (v) i.t = v; else tx.value = i.t; Notes.save(); };
      const setDue = v => { const ms = v ? new Date(v).getTime() : null; i.due = ms && !isNaN(ms) ? ms : null; i.fired = false; delete i.n; if (i.rep) { if (i.due) i.base = i.due; else { delete i.rep; delete i.base; } } if (i.due) this.ask(); Notes.save(); RPT.sync(false); Notes.arm(); Notes.badge(); this.render(); };
      if (i.due) { wh.className = 'when' + (late ? ' late' : ''); wh.innerHTML = `${ic('bell', 13)}<input type="datetime-local" aria-label="Reminder time"><select class="rps" title="Repeat" aria-label="Repeat">${RPT.OPTS.map(([v, n]) => `<option value="${v}">${n}</option>`).join('')}</select><button class="clrr" title="Remove the reminder, keep the item" aria-label="Remove reminder">clear</button>`; const di = $('input', wh); di.value = toLocalInput(i.due); di.title = this.fmt(i.due); di.onchange = () => setDue(di.value); const rs = $('.rps', wh); rs.value = i.rep || ''; rs.onchange = () => { if (rs.value) { i.rep = rs.value; i.base = i.due; } else { delete i.rep; delete i.base; } Notes.save(); RPT.sync(false); Notes.arm(); Notes.badge(); this.render(); }; $('button', wh).onclick = () => setDue(''); }
      else if (!i.done) { wh.innerHTML = `<button title="Add a reminder" aria-label="Add a reminder">${ic('bell', 13)}</button>`; $('button', wh).onclick = () => { wh.innerHTML = '<input type="datetime-local" aria-label="Reminder time">'; const di = $('input', wh); di.value = toLocalInput(Date.now() + 3600000); di.onchange = () => setDue(di.value); di.focus(); try { di.showPicker && di.showPicker(); } catch (_) { } }; }
      $('.x', r).onclick = () => { Notes.items = Notes.items.filter(a => a !== i); Notes.save(); RPT.sync(false); Notes.arm(); Notes.badge(); this.render(); };
      this.list.appendChild(r);
    }
    if (keep) { const r = this.list.querySelector(`.it[data-id="${keep}"] .tx`); if (r) r.focus(); }
  }
  onShow() { this.render(); }
  dispose() { Notes.flush(); }
}

/* ───────────── startup ───────────── */
(async () => {
  Tabs.updateWelcome();
  try {
    // measure column widths only after the embedded fonts are ready (give up after 1.5 s)
    await Promise.race([Promise.all(['400 13px Inter', '600 13px Inter', '400 12.5px "JetBrains Mono"', '700 12.5px "JetBrains Mono"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 1500))]).catch(() => {});
    const s = await api('startup');
    for (const t of s.tabs) {
      if (t.kind === 'doc') { const d = new DocTab(t.info, !!t.minified); Tabs.add(d); rememberRecent(t.info.path, false); }
      else if (t.kind === 'diff') { Tabs.add(new DiffTab(t.sid, t.state)); }
    }
  } catch (e) { fail(e); }
  fillIcons();
  Notes.load(); setTimeout(() => Update.auto(), 4000);
  { const qs = new URLSearchParams(location.search);   // opened from the tray menu or by a second `kempt gui file`
    for (const f of qs.getAll('open')) actions.openPath(f);
    const v = qs.get('view'); if (v === 'notes') actions.notes(); else if (v === 'clock') actions.clock();
    if (qs.has('open') || qs.has('view')) history.replaceState(null, '', location.pathname + '?t=' + encodeURIComponent(qs.get('t') || '')); }
})();
